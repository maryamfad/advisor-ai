[project]
name = "advisor-ai-api"
version = "0.1.0"
description = "AdvisorAI financial advisor platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "alembic>=1.13",
    "anthropic>=0.122.0",
    "langgraph>=0.2.60",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-postgres>=0.0.12",
    "pgvector>=0.3.6",
    "pypdf>=5.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-ollama>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]